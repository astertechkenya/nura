# netlify.toml: Netlify's settings, kept in the repository so they are versioned and reviewed
# like code. Settings here override the ones in Netlify's web dashboard.

[build]
  publish = "frontend"      # only the storefront is published; api/ never is
  # Skip the build when a push changes neither the storefront nor this file (an API-only push:
  # Render deploys those). Netlify's free plan pays for each production deploy in credits.
  # How it works: Netlify runs this command first; exit code 0 means "nothing to do, skip".
  # `git diff --quiet` exits 0 when the two commits have no differences in those paths.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend/ netlify.toml"

# The API appears under the storefront's own address: nurafashion.netlify.app/api/...
# status 200 makes this a REWRITE (Netlify fetches from Render and hands the answer back),
# not a redirect, so the browser only ever talks to one site. Cookies are first-party and
# there is no CORS to configure.
#
# `signed` makes Netlify add an x-nf-sign header, a token signed with the secret stored in
# the NETLIFY_PROXY_SECRET environment variable (set on Netlify AND on Render). The API
# believes the shopper-IP header only when that signature checks out.
# Product pages and the sitemap are rendered by the API too (api/src/routes/pages.js), so a
# link pasted into WhatsApp shows the product's photo, name and price. Same signed proxy.
[[redirects]]
  from = "/p/*"
  to = "https://nura-api-w1nm.onrender.com/p/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://nura-api-w1nm.onrender.com/sitemap.xml"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"

[[redirects]]
  from = "/api/*"
  to = "https://nura-api-w1nm.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"
