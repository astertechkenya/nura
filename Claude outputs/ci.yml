# ci.yml: GitHub checks every push and every pull request (Dependabot's included) three ways:
#   tests     the API's whole test suite, against a throwaway PostgreSQL
#   audit     known vulnerabilities in what Render installs (production dependencies)
#   secrets   gitleaks over the WHOLE history: a key committed and "deleted" later is still
#             in the history, and on a public repo anyone can read it
# A red ✗ on the commit means one failed; the Actions tab says which and why.
#
# Costs nothing: Actions minutes are free and unlimited for public repositories, and none of
# this touches Netlify (its ignore rule only builds for changes under frontend/).
name: CI

on:
  push:
    branches-ignore: ['dependabot/**']   # Dependabot's branches are checked as pull requests instead
  pull_request:

# The least access that works: read the code, nothing else. Nothing here can push, comment or
# touch issues, even if a dependency in the test run were malicious.
permissions:
  contents: read

# A newer push to the same branch cancels the older run: no point finishing an outdated check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      # A fresh PostgreSQL for this run only, deleted afterwards. Same major version as Neon.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password       # exists for minutes, reachable only inside this run
          POSTGRES_DB: nura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The tests wipe and rebuild this database (test/globalSetup.js). Every other setting,
      # and a fake for every outside service, comes from vitest.config.js: no secrets needed.
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/nura_test
    steps:
      # Actions are pinned to an exact commit, not a tag: a tag can be moved to different code,
      # a commit can't. Dependabot updates these pins (see dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false       # the run never needs to push
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22                 # package.json: engines.node >= 22.12
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Only production dependencies: what runs on Render. Dev tools (drizzle-kit, vitest) run
      # on your laptop and in CI, never against shoppers; their advisories reach you through
      # Dependabot alerts instead. Reads package-lock.json only; installs nothing.
      - run: npm audit --omit=dev --audit-level=moderate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                   # every commit, not just the latest
          persist-credentials: false
      # gitleaks as a plain program, checked against its published checksum before it runs.
      # To update: change the version and the checksum together (from the release's
      # gitleaks_<version>_checksums.txt, the linux_x64 line).
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
      # --redact: a real find shows WHERE (file, line, commit), never the secret itself in the log.
      # Exceptions for the tests' fake keys are in .gitleaks.toml.
      - run: ./gitleaks git --redact --no-banner --verbose .
