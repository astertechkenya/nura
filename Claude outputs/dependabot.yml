# dependabot.yml: GitHub opens a pull request when something we depend on has a new version.
# Each one runs the CI checks, so you merge only what passes. Security fixes come straight
# away; ordinary updates are bundled into one weekly pull request per area, to keep the noise
# down. Merging an api/ or .github/ update costs no Netlify credits (nothing under frontend/).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    groups:
      # Minor and patch versions together; a major version (possible breaking changes) gets
      # its own pull request, so it can be read on its own.
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    groups:
      actions:
        patterns: ['*']
